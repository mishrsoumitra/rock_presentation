# Every push and pull request: install from the lockfile, check the supply chain, type-check, test, build.
# The third-party corpus is not fetched here (see corpus.yml), so the corpus tests skip; everything else runs,
# including the end-to-end tests in headless Chromium.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Enable pnpm (the version package.json names)
        run: corepack enable
      - name: Find the pnpm store
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install (fails if the lockfile and package.json disagree)
        run: pnpm install --frozen-lockfile
      - name: Verify registry signatures and provenance attestations
        run: npm audit signatures
      - name: Audit for known vulnerabilities
        run: pnpm audit --audit-level=moderate
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium for the browser tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build the editor and the server's render page
        run: |
          pnpm --dir apps/web build
          pnpm --filter @pptx/server build:render-page
